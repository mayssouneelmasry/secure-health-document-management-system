{% extends "base.html" %}

{% block title %}Edit Doctor Visit{% endblock %}

{% block content %}
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <h1 class="h2"><i class="fas fa-stethoscope me-2"></i>Edit Doctor Visit</h1>
    </header>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="h5 mb-0"><i class="fas fa-edit me-2"></i>Update Doctor Visit</h3>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('documents.edit_doctor_visit', visit_id=visit.id) }}">
                <div class="mb-3">
                    <label for="user_id" class="form-label">Patient</label>
                    <select class="form-select" id="user_id" name="user_id" required>
                        <option value="">Select a patient</option>
                        {% for user in users %}
                        <option value="{{ user.id }}" {% if user.id == visit.user_id %}selected{% endif %}>{{ user.email }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="visit_date" class="form-label">Visit Date</label>
                    <input type="date" class="form-control" id="visit_date" name="visit_date" value="{{ visit.visit_date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="mb-3">
                    <label for="doctor_name" class="form-label">Doctor Name</label>
                    <input type="text" class="form-control" id="doctor_name" name="doctor_name" value="{{ visit.doctor_name }}" required>
                </div>
                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3">{{ visit.notes or '' }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="fas fa-save me-2"></i>Update Visit</button>
                <a href="{{ url_for('documents.manage_doctor_visits') }}" class="btn btn-secondary rounded-pill px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
