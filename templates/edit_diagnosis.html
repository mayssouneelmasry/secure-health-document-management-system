{% extends "base.html" %}

{% block title %}Edit Diagnosis{% endblock %}

{% block content %}
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <h1 class="h2"><i class="fas fa-diagnoses me-2"></i>Edit Diagnosis</h1>
    </header>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="h5 mb-0"><i class="fas fa-edit me-2"></i>Update Diagnosis</h3>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('documents.edit_diagnosis', diagnosis_id=diagnosis.id) }}">
                <div class="mb-3">
                    <label for="user_id" class="form-label">Patient</label>
                    <select class="form-select" id="user_id" name="user_id" required>
                        <option value="">Select a patient</option>
                        {% for user in users %}
                        <option value="{{ user.id }}" {% if user.id == diagnosis.user_id %}selected{% endif %}>{{ user.email }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="condition" class="form-label">Condition</label>
                    <input type="text" class="form-control" id="condition" name="condition" value="{{ diagnosis.condition }}" required>
                </div>
                <div class="mb-3">
                    <label for="diagnosis_date" class="form-label">Diagnosis Date</label>
                    <input type="date" class="form-control" id="diagnosis_date" name="diagnosis_date" value="{{ diagnosis.diagnosis_date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="mb-3">
                    <label for="visit_id" class="form-label">Related Doctor Visit (Optional)</label>
                    <select class="form-select" id="visit_id" name="visit_id">
                        <option value="">None</option>
                        {% for visit in visits %}
                        <option value="{{ visit.id }}" {% if diagnosis.visit_id == visit.id %}selected{% endif %}>{{ visit.doctor_name }} - {{ visit.visit_date.strftime('%Y-%m-%d') }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="details" class="form-label">Details</label>
                    <textarea class="form-control" id="details" name="details" rows="4">{{ diagnosis.details or '' }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="fas fa-save me-2"></i>Update Diagnosis</button>
                <a href="{{ url_for('documents.manage_diagnoses') }}" class="btn btn-secondary rounded-pill px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
